# Gate de cobertura (skill flujo-desarrollo, puerta P4).
# Fase 0: el repo no tenía medición. Se mide `lib/` (lógica pura); ver el porqué en phpunit.xml.dist.
name: Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cobertura-ref
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pruebas con cobertura
        run: |
          mkdir -p build
          # `pcov.directory` se fija al repo a proposito: con un `<source>` que mezcla <directory> y <file>,
          # pcov solo instrumenta el directorio y los ficheros sueltos de la raiz salen al 0 %. Medido: sin
          # esto, `health-check.php` daba 0/603 pese a que sus funciones se ejecutan en las pruebas.
          php -d pcov.directory="$PWD" vendor/bin/phpunit -c phpunit.xml.dist \
            --coverage-clover build/coverage.xml --coverage-text

      - name: Leer la cobertura y aplicar el suelo
        run: |
          set -euo pipefail
          pct=$(php -r '$x=@simplexml_load_file("build/coverage.xml"); if(!$x){echo "0"; exit;} $m=$x->project->metrics; $t=(int)$m["statements"]; $c=(int)$m["coveredstatements"]; printf("%.1f", $t>0 ? $c*100/$t : 0);')
          echo "Cobertura de líneas: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -f .coverage-floor ]]; then
            suelo=$(tr -d '[:space:]%' < .coverage-floor)
            echo "Suelo exigido: ${suelo}%" | tee -a "$GITHUB_STEP_SUMMARY"
            if php -r "exit((${pct} < ${suelo}) ? 1 : 0);"; then
              echo "OK: por encima del suelo"
            else
              echo "FALLO: la cobertura (${pct}%) está por debajo del suelo (${suelo}%)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "Modo bootstrap: no hay .coverage-floor, sólo informo" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

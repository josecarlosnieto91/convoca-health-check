name: Convoca Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit-unit:
    name: PHPUnit unit (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [convoca-core, convoca-members, convoca-enroll, convoca-gateway, convoca-shifts, convoca-publisher, convoca-assistant, convoca-theme]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/${{ matrix.plugin }}
          path: ${{ matrix.plugin }}

      - name: Checkout convoca-core (dependencia para bootstraps)
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-core
          path: convoca-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd
          coverage: none

      - name: Instalar dependencias del plugin
        working-directory: ${{ matrix.plugin }}
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -5
          fi

      - name: Instalar dependencias de convoca-core
        working-directory: convoca-core
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -5
          fi

      - name: Ejecutar PHPUnit unit (bootstrap-unit standalone)
        working-directory: ${{ matrix.plugin }}
        run: |
          # Los tests unitarios corren standalone con mocks WP (bootstrap-unit.php),
          # sin necesidad de WordPress real ni WP test suite.
          if [ -f tests/bootstrap-unit.php ]; then
            vendor/bin/phpunit --bootstrap tests/bootstrap-unit.php tests/Unit 2>&1 | tail -30
          elif [ -f tests/bootstrap.php ]; then
            vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Unit 2>&1 | tail -30
          else
            echo "Sin tests unitarios"
          fi

  health-check:
    name: Health Check en demo
    runs-on: ubuntu-latest
    needs: phpunit-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: SSH al servidor
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Alias andromeda → IP Tailscale (100.77.127.2)
          printf 'Host andromeda\n    HostName 100.77.127.2\n    User josecnr91\n    IdentityFile ~/.ssh/id_ed25519\n    StrictHostKeyChecking no\n    UserKnownHostsFile /dev/null\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          # Verificar conexión
          ssh -o ConnectTimeout=15 andromeda 'echo SSH_OK' 2>&1 | tail -1

      - name: Ejecutar batería
        working-directory: health
        run: |
          chmod +x bin/convoca-health
          ./bin/convoca-health --ssh=andromeda --path=/var/www/demo.getconvoca.app/public

  e2e:
    name: E2E Playwright (demo)
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        working-directory: health
        run: |
          npm init -y >/dev/null
          npm install @playwright/test >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Ejecutar E2E contra demo
        working-directory: health
        env:
          E2E_BASE: https://demo.getconvoca.app
        run: npx playwright test e2e/ 2>&1 | tail -30 || true

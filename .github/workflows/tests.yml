name: Convoca Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit-unit:
    name: PHPUnit unit (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [convoca-core, convoca-members, convoca-enroll, convoca-gateway, convoca-shifts, convoca-publisher, convoca-assistant, convoca-theme]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/${{ matrix.plugin }}
          path: ${{ matrix.plugin }}

      - name: Checkout convoca-core (dependencia para bootstraps)
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-core
          path: convoca-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd
          coverage: none

      - name: Instalar dependencias del plugin
        working-directory: ${{ matrix.plugin }}
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -5
          fi

      - name: Instalar dependencias de convoca-core
        working-directory: convoca-core
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -5
          fi

      - name: Ejecutar PHPUnit unit (bootstrap-unit standalone)
        working-directory: ${{ matrix.plugin }}
        run: |
          if [ -f tests/bootstrap-unit.php ]; then
            vendor/bin/phpunit --bootstrap tests/bootstrap-unit.php tests/Unit 2>&1 | tail -30
          elif [ -f tests/bootstrap.php ]; then
            vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Unit 2>&1 | tail -30
          else
            echo "Sin tests unitarios"
          fi

  health-check-local:
    name: Health Check local (WP de test)
    runs-on: ubuntu-latest
    needs: phpunit-unit
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout health-check
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, mysqli
          tools: wp-cli

      - name: Descargar e instalar WordPress
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --allow-root --locale=es_ES 2>&1 | tail -2
          wp config create --allow-root --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check 2>&1 | tail -2
          wp core install --allow-root --url=http://localhost --title="Convoca Test" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email 2>&1 | tail -2

      - name: Instalar plugins Convoca
        run: |
          cd /tmp/wp
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            git clone -q --depth 1 https://github.com/josecarlosnieto91/$p.git /tmp/wp/wp-content/plugins/$p 2>/dev/null || true
            if [ -f /tmp/wp/wp-content/plugins/$p/composer.json ]; then
              cd /tmp/wp/wp-content/plugins/$p
              # composer update genera lock compatible con el PHP del runner
              composer update --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -2 || echo "composer update falló en $p (continuando)"
              # Regenerar autoloader (el update con --no-scripts no lo hace)
              composer dump-autoload --no-interaction 2>&1 | tail -1 || true
              cd /tmp/wp
            fi
          done
          git clone -q --depth 1 https://github.com/josecarlosnieto91/convoca-theme.git /tmp/wp/wp-content/themes/convoca 2>/dev/null || true
          wp theme activate convoca --allow-root 2>&1 | tail -1
          echo "--- ACTIVAR UNO A UNO ---"
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            wp plugin activate $p --allow-root 2>&1 | tail -2
          done
          echo "--- ESTADO PLUGINS ---"
          wp plugin list --allow-root --fields=name,status 2>&1 | head -10

      - name: Ejecutar Health Check local (modo --local)
        working-directory: /tmp/wp
        env:
          CONVOCA_HC_LOCAL: '1'
        run: |
          set +e
          # Verificar que wp-cli y el health-check están disponibles
          which wp || echo "wp NO encontrado en PATH"
          ls -la /home/runner/work/convoca-health-check/convoca-health-check/health/health-check.php || echo "health-check.php NO existe"
          wp --version --allow-root 2>&1 | head -1
          # Ejecutar el health check capturando salida y exit code por separado
          OUTPUT=$(wp eval-file /home/runner/work/convoca-health-check/convoca-health-check/health/health-check.php --allow-root 2>&1)
          EXIT=$?
          echo "EXIT_CODE: $EXIT"
          echo "$OUTPUT"
          FAILS=$(echo "$OUTPUT" | grep -c "\[FAIL\]")
          echo "FAILS: $FAILS"
          if [ "$FAILS" -gt 0 ]; then
            echo "::error::$FAILS checks fallaron en modo local"
            exit 1
          fi
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::wp eval-file terminó con exit $EXIT"
            exit 1
          fi
          echo "Health check local OK (0 FAILs)"

  health-check-demo:
    name: Health Check demo (requiere túnel)
    runs-on: ubuntu-latest
    needs: health-check-local
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: SSH al servidor (vía túnel configurado)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host andromeda-ci\n    HostName andromeda.example.trycloudflare.com\n    User josecnr91\n    IdentityFile ~/.ssh/id_ed25519\n    StrictHostKeyChecking no\n    UserKnownHostsFile /dev/null\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Ejecutar batería en demo
        run: |
          OUT=$(ssh -o ConnectTimeout=60 andromeda-ci 'test' 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q "FAIL"; then
            echo "::error::Convoca Health Check FALLÓ en demo"
            exit 1
          fi

  e2e:
    name: E2E Playwright (público)
    runs-on: ubuntu-latest
    needs: health-check-local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        working-directory: health
        run: |
          npm init -y >/dev/null
          npm install @playwright/test >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Ejecutar E2E contra demo pública
        working-directory: health
        env:
          E2E_BASE: https://demo.getconvoca.app
        run: npx playwright test e2e/ 2>&1 | tail -30 || true

name: Convoca Test Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [convoca-core, convoca-members, convoca-enroll, convoca-gateway, convoca-shifts, convoca-publisher, convoca-assistant, convoca-theme]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/${{ matrix.plugin }}
          path: ${{ matrix.plugin }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, gd
          coverage: none
          tools: composer, wp-cli

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ matrix.plugin }}/vendor
          key: ${{ matrix.plugin }}-composer-${{ hashFiles(format('{0}/composer.lock', matrix.plugin)) }}
          restore-keys: |
            ${{ matrix.plugin }}-composer-

      - name: Instalar dependencias del plugin
        working-directory: ${{ matrix.plugin }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar WordPress test suite
        env:
          WP_VERSION: latest
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true 2>/dev/null || true
          # Si no existe el script del plugin, usar el estándar
          if [ ! -f "${{ matrix.plugin }}/bin/install-wp-tests.sh" ]; then
            curl -sL https://raw.githubusercontent.com/wp-cli/wp-cli/main/templates/install-wp-tests.sh -o /tmp/install-wp-tests.sh
            bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true
          fi

      - name: Ejecutar PHPUnit
        working-directory: ${{ matrix.plugin }}
        run: vendor/bin/phpunit --configuration phpunit.xml.dist 2>&1 | tail -30

  health-check:
    name: Health Check en demo
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: SSH al servidor
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANDROMEDA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H andromeda >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ejecutar batería
        working-directory: health
        run: |
          chmod +x bin/convoca-health
          ./bin/convoca-health --ssh=andromeda --path=/var/www/demo.getconvoca.app/public

  e2e:
    name: E2E Playwright (demo)
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        working-directory: health
        run: |
          npm init -y >/dev/null
          npm install @playwright/test >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Ejecutar E2E contra demo
        working-directory: health
        env:
          E2E_BASE: https://demo.getconvoca.app
        run: npx playwright test e2e/ 2>&1 | tail -30 || true

name: Convoca Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de release (ej: 3.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  health-check:
    name: Health Check (pre-release, local)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, mysqli
          tools: wp-cli

      - name: Descargar e instalar WordPress
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --allow-root --locale=es_ES 2>&1 | tail -1
          wp config create --allow-root --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check 2>&1 | tail -1
          wp core install --allow-root --url=http://localhost --title="Convoca Release Test" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email 2>&1 | tail -1

      - name: Instalar plugins Convoca
        run: |
          cd /tmp/wp
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            git clone -q --depth 1 https://github.com/josecarlosnieto91/$p.git /tmp/wp/wp-content/plugins/$p 2>/dev/null || true
            if [ -f /tmp/wp/wp-content/plugins/$p/composer.json ]; then
              cd /tmp/wp/wp-content/plugins/$p
              composer update --no-interaction --prefer-dist --no-progress --no-scripts 2>&1 | tail -1 || true
              composer dump-autoload --no-interaction 2>&1 | tail -1 || true
              cd /tmp/wp
            fi
          done
          git clone -q --depth 1 https://github.com/josecarlosnieto91/convoca-theme.git /tmp/wp/wp-content/themes/convoca 2>/dev/null || true
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            wp plugin activate $p --allow-root 2>&1 | tail -1
          done
          wp theme activate convoca --allow-root 2>&1 | tail -1

      - name: Ejecutar Health Check local (modo --local)
        working-directory: /tmp/wp
        env:
          CONVOCA_HC_LOCAL: '1'
        run: |
          set +e
          OUTPUT=$(wp eval-file /home/runner/work/convoca-health-check/convoca-health-check/health/health-check.php --allow-root 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          FAILS=$(echo "$OUTPUT" | grep -c "\[FAIL\]")
          echo "FAILS: $FAILS"
          if [ "$FAILS" -gt 0 ] || [ "$EXIT" -ne 0 ]; then
            echo "::error::Health Check FALLÓ — release abortada"
            exit 1
          fi
          echo "Health Check OK — release puede proceder"

  build:
    name: Build ZIP (${{ matrix.repo }})
    needs: health-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [convoca-core, convoca-members, convoca-enroll, convoca-gateway, convoca-shifts, convoca-publisher, convoca-assistant, convoca-theme]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/${{ matrix.repo }}
          path: src

      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: qa

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, iconv, zip
          tools: composer

      - name: Ejecutar build-release
        run: |
          bash qa/scripts/build-release.sh src dist

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}
          path: dist/${{ matrix.repo }}.zip
          if-no-files-found: error

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download todos los ZIPs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determinar versión
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${DISPATCH_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Crear release con ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "v${{ steps.version.outputs.VERSION }}" \
            dist/*.zip \
            --repo josecarlosnieto91/convoca-health-check \
            --title "Convoca v${{ steps.version.outputs.VERSION }}" \
            --notes "Release generada por el pipeline de distribución.
            Los ZIPs están listos para WordPress.org (< 10 MB)."

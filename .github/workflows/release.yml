name: Convoca Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de release (ej: 3.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  health-check:
    name: Health Check (pre-release, local)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: health

      - name: Setup PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          # 8.4: es el PHP de producción (Orion 8.4.23; Andromeda 8.5) y el
          # que exige composer.lock (eluceo/ical 2.17.0 requiere ~8.4||~8.5).
          # Con 8.2 el 'composer install' del lock fallaba y convoca-enroll
          # se quedaba sin vendor/bin/phpunit (exit 127).
          php-version: '8.4'
          extensions: mbstring, intl, gd, mysqli
          tools: wp-cli

      - name: Descargar e instalar WordPress
        run: |
          # Sin `| tail`: el pipe devolvía el exit code de `tail`, así que una
          # instalación fallida dejaba el release «validado» con el health check
          # corriendo sobre un WordPress que no existía.
          # Sin --locale=es_ES: ese paquete no existe en el endpoint de descarga.
          set -euo pipefail
          mkdir -p /tmp/wp && cd /tmp/wp
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; then break; fi
            sleep 2
          done
          (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null || { echo "::error::MariaDB no acepta conexiones en 127.0.0.1:3306"; exit 1; }
          wp core download --allow-root
          wp config create --allow-root --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --allow-root --url=http://localhost --title="Convoca Release Test" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp core is-installed --allow-root

      - name: Instalar plugins Convoca
        run: |
          cd /tmp/wp
          set -euo pipefail
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            # Un clon que falla en silencio deja el release validado contra menos
            # plugins de los que se van a publicar: aquí tiene que fallar.
            git clone -q --depth 1 https://github.com/josecarlosnieto91/$p.git /tmp/wp/wp-content/plugins/$p
            if [ -f /tmp/wp/wp-content/plugins/$p/composer.json ]; then
              ( cd /tmp/wp/wp-content/plugins/$p && composer install --no-interaction --prefer-dist --no-progress --no-scripts --ignore-platform-req=ext-iconv && composer dump-autoload --no-interaction )
            fi
          done
          git clone -q --depth 1 https://github.com/josecarlosnieto91/convoca-theme.git /tmp/wp/wp-content/themes/convoca
          for p in convoca-core convoca-members convoca-enroll convoca-gateway convoca-shifts convoca-publisher convoca-assistant; do
            wp plugin activate $p --allow-root
          done
          wp theme activate convoca --allow-root
          echo "Plugins activos:"; wp plugin list --allow-root --status=active --field=name

      - name: Ejecutar Health Check local (modo --local)
        working-directory: /tmp/wp
        env:
          CONVOCA_HC_LOCAL: '1'
        run: |
          set +e
          OUTPUT=$(wp eval-file /home/runner/work/convoca-health-check/convoca-health-check/health/health-check.php --allow-root 2>&1)
          EXIT=$?
          echo "$OUTPUT"
          FAILS=$(echo "$OUTPUT" | grep -c "\[FAIL\]")
          echo "FAILS: $FAILS"
          if [ "$FAILS" -gt 0 ] || [ "$EXIT" -ne 0 ]; then
            echo "::error::Health Check FALLÓ — release abortada"
            exit 1
          fi
          echo "Health Check OK — release puede proceder"

  build:
    name: Build ZIP (${{ matrix.repo }})
    needs: health-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [convoca-core, convoca-members, convoca-enroll, convoca-gateway, convoca-shifts, convoca-publisher, convoca-assistant, convoca-theme]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/${{ matrix.repo }}
          path: src

      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: qa

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          # 8.4: es el PHP de producción (Orion 8.4.23; Andromeda 8.5) y el
          # que exige composer.lock (eluceo/ical 2.17.0 requiere ~8.4||~8.5).
          # Con 8.2 el 'composer install' del lock fallaba y convoca-enroll
          # se quedaba sin vendor/bin/phpunit (exit 127).
          php-version: '8.4'
          extensions: mbstring, intl, gd, iconv, zip
          tools: composer

      - name: Ejecutar build-release
        run: |
          bash qa/scripts/build-release.sh src dist

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}
          path: dist/${{ matrix.repo }}.zip
          if-no-files-found: error

  svn-deploy:
    name: Deploy WordPress.org SVN
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # El contexto secrets NO está disponible en jobs.<job_id>.if (solo
      # github, needs, vars e inputs): usarlo ahí invalida el workflow entero
      # y el run falla sin llegar a crear jobs. La comprobación va en un step.
      - name: Comprobar credenciales de WordPress.org
        id: creds
        env:
          SVN_USER: ${{ secrets.WP_ORG_SVN_USER }}
        run: |
          if [ -n "$SVN_USER" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin credenciales de WordPress.org — se omite el deploy a SVN."
          fi

      - name: Download todos los ZIPs
        if: steps.creds.outputs.ok == '1'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checkout scripts
        if: steps.creds.outputs.ok == '1'
        uses: actions/checkout@v4
        with:
          repository: josecarlosnieto91/convoca-health-check
          path: qa

      - name: Instalar SVN
        if: steps.creds.outputs.ok == '1'
        run: sudo apt-get update -q && sudo apt-get install -y -q subversion unzip

      - name: Deploy a WordPress.org
        if: steps.creds.outputs.ok == '1'
        env:
          SVN_USER: ${{ secrets.WP_ORG_SVN_USER }}
          SVN_PASS: ${{ secrets.WP_ORG_SVN_PASS }}
        run: |
          cd qa
          for f in ../dist/*.zip; do
            slug=$(basename "$f" .zip)
            # Solo plugins (el theme se despliega a themes.svn.wordpress.org aparte)
            case "$slug" in convoca-theme) continue;; esac
            echo "=== Deploy: $slug ==="
            bash scripts/svn-deploy.sh "$slug" "$f" || echo "::warning::Fallo SVN deploy de $slug"
          done

  publish:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download todos los ZIPs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determinar versión
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${DISPATCH_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Crear release con ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release create "v${{ steps.version.outputs.VERSION }}" \
            dist/*.zip \
            --repo josecarlosnieto91/convoca-health-check \
            --title "Convoca v${{ steps.version.outputs.VERSION }}" \
            --notes "Release generada por el pipeline de distribución.
            Los ZIPs están listos para WordPress.org (< 10 MB)."

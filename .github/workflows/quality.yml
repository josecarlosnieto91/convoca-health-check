name: Calidad (ratchet)

# Workflow reutilizable: cada repo llama con `uses:` y aporta su .quality/baseline.json.
# No decora PRs (la edición Community de Sonar no lo permite): bloquea el job si un número sube.
on:
  workflow_call:
    inputs:
      repo_name:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --no-progress --prefer-dist || true

      - name: Reglas y herramientas
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/josecarlosnieto91/convoca-health-check.git /tmp/quality && break
            echo "reintento de git clone ($i)"; sleep 5
          done
          mkdir -p /tmp/bin
          curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused \
            -o /tmp/phpmd.phar https://github.com/phpmd/phpmd/releases/download/3.0.0/phpmd.phar
          curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused \
            -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp/bin gitleaks
          echo "/tmp/bin" >> "$GITHUB_PATH"
          python3 -m pip install --quiet --retries 3 'semgrep==1.181.1'

      - name: Puerta con ratchet
        env:
          QUALITY_RULES: /tmp/quality/quality
        run: |
          set -euo pipefail
          bash /tmp/quality/quality/ci-gate.sh .
